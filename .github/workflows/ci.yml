# CI (Integración Continua): en cada push o pull request, GitHub ejecuta
# automáticamente estas verificaciones. Si alguna falla, el cambio se marca
# en rojo y no debería mezclarse.
#
# Tres jobs que corren EN PARALELO:
#   1. quality:  formato, go vet, linter y pruebas (con -race y cobertura).
#   2. security: vulnerabilidades en las dependencias (govulncheck).
#   3. image:    construye la imagen Docker y la escanea con Trivy.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Principio de menor privilegio: el workflow solo puede LEER el repositorio.
permissions:
  contents: read

jobs:
  quality:
    name: Calidad y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          # Lee la directiva "toolchain" de go.mod (go1.27.3), no solo "go 1.27.0".
          # Importa: govulncheck también revisa la librería estándar de Go, y
          # 1.27.0 tiene vulnerabilidades corregidas en 1.27.3.
          go-version-file: go.mod

      - name: Versión de Go
        run: go version

      - name: Formato (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Archivos sin formato:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      # golangci-lint ejecuta muchos linters juntos, incluido gosec (SAST).
      # La configuración está en .golangci.yml.
      - name: Linter (golangci-lint)
        uses: golangci/golangci-lint-action@v8
        with:
          # El linter debe estar compilado con una versión de Go >= la del
          # proyecto (1.27); v2.5 usa Go 1.25 y falla. Cuando se confirme una
          # versión que funcione, fijarla aquí (ej. v2.x.y) para builds reproducibles.
          version: latest

      # -race: detector de condiciones de carrera (en Linux funciona sin
      # instalar nada extra). -coverprofile: cuánto código cubren las pruebas.
      - name: Pruebas
        run: go test -race -coverprofile=coverage.out ./...

      - name: Cobertura
        run: go tool cover -func=coverage.out | tail -1

  security:
    name: Vulnerabilidades en dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Versión de Go
        run: go version
      # govulncheck: herramienta oficial de Go. Solo avisa si el código
      # REALMENTE llama a la función vulnerable, no solo si la librería existe.
      # Revisa las dependencias Y la librería estándar de la versión de Go usada.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  image:
    name: Imagen Docker + escaneo
    runs-on: ubuntu-latest
    needs: quality # solo se construye si las pruebas pasaron
    steps:
      - uses: actions/checkout@v5
      - name: Construir imagen
        run: docker build -t orders-api:ci .
      # Trivy busca vulnerabilidades conocidas (CVE) en la imagen: sistema
      # base y binario. Falla si encuentra severidad HIGH o CRITICAL.
      - name: Escanear imagen (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: orders-api:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
